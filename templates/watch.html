{% extends "base.html" %}
{% load static %}
{% block title %}Watch — EduClip AI{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/chapters.css' %}" />
{% endblock %}

{% block content %}
<div id="pageError" class="hidden rounded-2xl border border-red-500/40 bg-red-950/40 p-6 text-center">
  <p id="pageErrorMsg" class="font-semibold">Could not load this video.</p>
  <button id="retryBtn" type="button" class="mt-4 px-5 py-2.5 rounded-xl font-semibold bg-gradient-to-r from-violet-600 to-cyan-500 hover:opacity-90 transition">Retry</button>
</div>

<div id="watchWrap">
  <div class="animate-fade-up">
    <h1 id="videoTitle" class="text-2xl sm:text-3xl font-extrabold tracking-tight">Loading video…</h1>
    <p id="videoMeta" class="mt-1 text-sm text-gray-400"></p>
  </div>

  <div class="grid lg:grid-cols-3 gap-6 mt-6">
    <div class="lg:col-span-2">
      <div class="sticky top-16 z-10 rounded-2xl overflow-hidden border border-slate-800 bg-black aspect-video relative">
        <div id="player" class="absolute inset-0"></div>
        <div id="chapterToast" class="absolute bottom-4 left-4 px-3 py-1.5 rounded-lg bg-black/70 text-sm hidden" aria-live="polite"></div>
      </div>
      <p class="mt-3 text-xs text-gray-500">Tip: click any timestamp to jump the player.</p>
    </div>
    <aside class="space-y-3" aria-label="Chapters">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-gray-300">Chapters</h2>
        <span id="chapterCount" class="text-xs font-mono text-gray-500"></span>
      </div>
      <div id="chapterList" class="space-y-2 max-h-[600px] overflow-y-auto pr-1"></div>
    </aside>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/player.js' %}"></script>
{% endblock %}
